version: 1
name: devroost-spring-react
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  backend:
    type: java
    image: ${JAVA_IMAGE:-ghcr.io/devroost-org/devroost-java-21@sha256:576bb2470a390e3f1aa1f751a3a6dd586c619050032084beffad52a48c46a97e}
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /workspace/backend
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.address=0.0.0.0 -Dserver.port=8080"
    ports:
      - "8081:8080"
    volumes:
      - ./:/workspace
  web:
    type: node
    image: ${NODE_IMAGE:-ghcr.io/devroost-org/devroost-node-22@sha256:d619f341b065fc1bf6c0e3b793847f202fad1478c37b54c0f11aed1b55ca798b}
    userns: keep-id
    execUser: ${HOST_UID:-1000}:${HOST_GID:-1000}
    workdir: /workspace/frontend
    command: sh -c "npm install && npm run build && exec npm run serve"
    ports:
      - "5175:5175"
    volumes:
      - ./:/workspace
    dependsOn:
      - backend
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:5175').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 5
      timeoutSeconds: 5
      retries: 80
      startPeriodSeconds: 10
routes:
  - host: spring-react.devroost.local
    service: web
    port: 5175
    https: true
