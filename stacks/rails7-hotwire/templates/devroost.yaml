version: 1
name: devroost-rails7-hotwire
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: ruby
    image: ${RUBY_IMAGE:-ghcr.io/devroost-org/devroost-ruby-3.3@sha256:22adac98a37af8a24e2b4c59a1b003f4fcf165431ae3967fdedd01f83b72f8ae}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/devroost-home/gems /tmp/devroost-home/bundle /tmp/devroost-home/bundle-config && export HOME=/tmp/devroost-home GEM_HOME=/tmp/devroost-home/gems GEM_PATH=/tmp/devroost-home/gems PATH=/tmp/devroost-home/gems/bin:$PATH BUNDLE_PATH=/tmp/devroost-home/bundle BUNDLE_APP_CONFIG=/tmp/devroost-home/bundle-config && gem install bundler -v 2.6.9 --no-document && bundle install && exec bin/rails server -b 0.0.0.0 -p 3008'
    ports:
      - "3008:3008"
    volumes:
      - ./:/workspace
    healthcheck:
      command: ruby -rsocket -e "TCPSocket.new('127.0.0.1', 3008).close"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 150
      startPeriodSeconds: 10
routes:
  - host: rails7-hotwire.devroost.local
    service: app
    port: 3008
    https: true
