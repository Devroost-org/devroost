version: 1
name: node-t3-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: node
    image: ${NODE_IMAGE:-ghcr.io/devroost-org/devroost-node-24@sha256:5b3b1780892e2701df00b8f37d9a7e49c910992b58bffed95ccfb7ba58875402}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/devroost-home && HOME=/tmp/devroost-home corepack pnpm install && HOME=/tmp/devroost-home exec corepack pnpm dev'
    ports:
      - "3003:3003"
    volumes:
      - ./:/workspace
    env:
      PORT: "3003"
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:3003').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 120
      startPeriodSeconds: 6
routes:
  - host: t3.devroost.local
    service: app
    port: 3003
    https: true
tasks:
  test:
    service: app
    command: corepack pnpm typecheck
