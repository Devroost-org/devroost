version: 1
name: devroost-db-redis
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  db:
    type: redis
    image: ${REDIS_IMAGE:-ghcr.io/devroost-org/redis-7.4@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f}
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      command: redis-cli ping | grep PONG
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 30
      startPeriodSeconds: 2
