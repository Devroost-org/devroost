version: 1
name: devroost-db-mysql
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  db:
    type: mysql
    image: ${MYSQL_IMAGE:-ghcr.io/devroost-org/mysql-8.4@sha256:221c78806de3686d3fb4569df99af86bdb0f5cf4f7087e1e2d9c4527fa5e681a}
    env:
      MYSQL_ROOT_PASSWORD: devroostroot
      MYSQL_DATABASE: devroost
      MYSQL_USER: devroost
      MYSQL_PASSWORD: devroost
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      command: mysqladmin ping -h 127.0.0.1 -uroot -pdevroostroot
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 30
      startPeriodSeconds: 10
