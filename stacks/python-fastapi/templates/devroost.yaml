version: 1
name: python-fastapi-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: python
    image: ${PYTHON_IMAGE:-ghcr.io/devroost-org/devroost-python-3.12@sha256:dfc56d79d2e1ec7552b172f58bab8468929cf80dca40a33078654bc5fb8d9a94}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/devroost-home/.local /tmp/devroost-home/.cache/pip && export HOME=/tmp/devroost-home PATH=/tmp/devroost-home/.local/bin:$PATH PIP_CACHE_DIR=/tmp/devroost-home/.cache/pip && pip install --disable-pip-version-check --user -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8003'
    ports:
      - "8003:8003"
    volumes:
      - ./:/workspace
    healthcheck:
      command: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 120
      startPeriodSeconds: 8
routes:
  - host: fastapi.devroost.local
    service: app
    port: 8003
    https: true
tasks:
  test:
    service: app
    command: python -c "import app.main; print('fastapi app ok')"
