version: 1
name: devroost-db-postgres
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  db:
    type: postgres
    image: ${POSTGRES_IMAGE:-ghcr.io/devroost-org/postgres-16@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685}
    env:
      POSTGRES_USER: devroost
      POSTGRES_PASSWORD: devroost
      POSTGRES_DB: devroost
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      command: pg_isready -U devroost
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 30
      startPeriodSeconds: 5
