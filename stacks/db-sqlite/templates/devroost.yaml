version: 1
name: devroost-db-sqlite
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  db:
    type: sqlite
    image: ${SQLITE_IMAGE:-ghcr.io/devroost-org/devroost-sqlite-3@sha256:98a568db611c27ddaa23a570f5710161d7e1a38f921769ae1b41c2f4a45861fd}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    entrypoint: ""
    command: sh -c "sqlite3 /data/devroost.db 'select 1;' && tail -f /dev/null"
    workdir: /data
    volumes:
      - ./data/sqlite:/data
