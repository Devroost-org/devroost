version: 1
name: astro-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: node
    image: ${NODE_IMAGE:-ghcr.io/devroost-org/devroost-node-24@sha256:5b3b1780892e2701df00b8f37d9a7e49c910992b58bffed95ccfb7ba58875402}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/devroost-home && HOME=/tmp/devroost-home npm install && HOME=/tmp/devroost-home exec npx astro dev --host 0.0.0.0 --port 4321'
    ports:
      - "4321:4321"
    volumes:
      - ./:/workspace
    healthcheck:
      command: node -e "fetch('http://127.0.0.1:4321').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 120
      startPeriodSeconds: 15
routes:
  - host: astro.devroost.local
    service: app
    port: 4321
    https: true
tasks:
  test:
    service: app
    command: npx astro check
