version: 1
name: python-django-example
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: python
    image: ${PYTHON_IMAGE:-ghcr.io/devroost-org/devroost-python-3.12@sha256:884a0f59134fbdb22320961af5568f4f2664e38b18d445a7d72000d905338fba}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    workdir: /workspace
    command: sh -c 'mkdir -p /tmp/devroost-home/.local /tmp/devroost-home/.cache/pip && export HOME=/tmp/devroost-home PATH=/tmp/devroost-home/.local/bin:$PATH PIP_CACHE_DIR=/tmp/devroost-home/.cache/pip && pip install --disable-pip-version-check --user -r requirements.txt && python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8001'
    ports:
      - "8001:8001"
    volumes:
      - ./:/workspace
    healthcheck:
      command: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 120
      startPeriodSeconds: 8
routes:
  - host: django.devroost.local
    service: app
    port: 8001
    https: true
tasks:
  test:
    service: app
    command: python manage.py test
