version: 1
name: devroost-bun
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  app:
    type: node
    image: ${BUN_IMAGE:-ghcr.io/devroost-org/devroost-bun-1@sha256:0a6a1bd48cebd98167d215756f7cdea48d3a0e568003c6dcaf0cfc453188fe48}
    userns: keep-id
    workdir: /workspace
    command: bun run dev
    ports:
      - "3004:3004"
    volumes:
      - ./:/workspace
    env:
      NODE_ENV: development
    healthcheck:
      command: bun -e "fetch('http://127.0.0.1:3004/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      intervalSeconds: 4
      timeoutSeconds: 4
      retries: 60
      startPeriodSeconds: 10
routes:
  - host: bun.devroost.local
    service: app
    port: 3004
    https: true
