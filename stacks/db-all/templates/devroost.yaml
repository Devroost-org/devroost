version: 1
name: devroost-db-all
runtime:
  engine: podman
  rootless: true
  machine:
    managed: true
services:
  mysql:
    type: mysql
    image: ${MYSQL_IMAGE:-ghcr.io/devroost-org/mysql-8.4@sha256:200b8d4d14f72cb6dbea7686a14d8591f5b5fb3e0b83a1a662dc9094efa1bbf0}
    env:
      MYSQL_ROOT_PASSWORD: devroostroot
      MYSQL_DATABASE: devroost
      MYSQL_USER: devroost
      MYSQL_PASSWORD: devroost
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      command: mysqladmin ping -h 127.0.0.1 -uroot -pdevroostroot
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 30
      startPeriodSeconds: 10

  sqlserver:
    type: sqlserver
    image: ${MSSQL_IMAGE:-ghcr.io/devroost-org/mssql-2022@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090}
    env:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevroostDev!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ./data/sqlserver:/var/opt/mssql

  postgres:
    type: postgres
    image: ${POSTGRES_IMAGE:-ghcr.io/devroost-org/postgres-16@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab}
    env:
      POSTGRES_USER: devroost
      POSTGRES_PASSWORD: devroost
      POSTGRES_DB: devroost
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      command: pg_isready -U devroost
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 30
      startPeriodSeconds: 5

  mongodb:
    type: mongodb
    image: ${MONGO_IMAGE:-ghcr.io/devroost-org/mongo-7.0@sha256:94aea1479556ad4e5aba7a31a6d53eb7b0ae76741950da45a13d5df5cddf1b3b}
    env:
      MONGO_INITDB_ROOT_USERNAME: devroost
      MONGO_INITDB_ROOT_PASSWORD: devroost
      MONGO_INITDB_DATABASE: devroost
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db

  redis:
    type: redis
    image: ${REDIS_IMAGE:-ghcr.io/devroost-org/redis-7.4@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f}
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      command: redis-cli ping | grep PONG
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 30
      startPeriodSeconds: 2

  elasticsearch:
    type: elasticsearch
    image: ${ELASTICSEARCH_IMAGE:-ghcr.io/devroost-org/elasticsearch-8.19@sha256:4d0724bb8d78d7a2330693623e26ca4d621079d062ecc8a30b3e1fc180ec14c1}
    env:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  sqlite:
    type: sqlite
    image: ${SQLITE_IMAGE:-ghcr.io/devroost-org/devroost-sqlite-3@sha256:3f4b2421a867320ec0fdd7ae60d3106fde34afb95ceadbb78f94871ffc7b3af4}
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    userns: keep-id
    entrypoint: ""
    command: sh -c "sqlite3 /data/devroost.db 'select 1;' && tail -f /dev/null"
    workdir: /data
    volumes:
      - ./data/sqlite:/data

  mariadb:
    type: mariadb
    image: ${MARIADB_IMAGE:-ghcr.io/devroost-org/mariadb-11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd}
    env:
      MARIADB_ROOT_PASSWORD: devroostroot
      MARIADB_DATABASE: devroost
      MARIADB_USER: devroost
      MARIADB_PASSWORD: devroost
    ports:
      - "3307:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      command: mariadb-admin ping -h 127.0.0.1 -uroot -pdevroostroot
      intervalSeconds: 3
      timeoutSeconds: 3
      retries: 30
      startPeriodSeconds: 10
